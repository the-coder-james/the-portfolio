<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Blueprint badge: flat cyanotype navy, pale-cyan line art, a white
       glyph. No gradients: the site prints in flat inks, and flat fills
       also hold up better at 16px than a gradient does. -->

  <!-- Paper disc, edged in a line-art rim -->
  <circle cx="256" cy="256" r="246" fill="#0f2b4c"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#9ed2ff" stroke-width="6"/>

  <!-- Inner field, a step lighter like a sheet laid on the paper -->
  <circle cx="256" cy="256" r="181" fill="#14365e"/>

  <!-- Segmented arcs -->
  <path d="M 67 251 A 190 190 0 0 1 251 67"
        fill="none" stroke="#9ed2ff" stroke-width="18"
        stroke-linecap="round"/>
  <path d="M 445 261 A 190 190 0 0 1 261 445"
        fill="none" stroke="#9ed2ff" stroke-width="18"
        stroke-linecap="round"/>

  <!-- Code symbol -->
  <g fill="none" stroke="#eef4fb" stroke-width="20"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 214 210 L 157 256 L 214 302"/>
    <path d="M 298 210 L 355 256 L 298 302"/>
    <path d="M 274 190 L 238 322"/>
  </g>
</svg>
